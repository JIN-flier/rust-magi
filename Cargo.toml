[package]
name = "rust-magi"
version = "0.1.0"
edition = "2024"

[[example]]
name = "artical_review"
path = "examples/artical_review_flow.rs"

[[example]]
name = "meeting"
path = "examples/meeting_flow.rs"

[[example]]
name = "vote"
path = "examples/vote_flow.rs"

[[example]]
name = "intent"
path = "examples/intent_recog.rs"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
rig = { version = "0.45.0", features = ["test-utils"] }
schemars = "1.2.3"
serde = "1.0.229"
tokio = { version = "1.54.1", features = ["full"] }
